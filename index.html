<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pet Heaven helps abandoned cats and dogs in Singapore find safe, loving homes."
    />
    <meta name="theme-color" content="#fff8f0" />
    <script>
      try {
        const savedTheme = localStorage.getItem('pet-heaven-theme');
        const preferredTheme = savedTheme
          ? JSON.parse(savedTheme)
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (preferredTheme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121a1b');
        }
      } catch {
        // Keep the default light theme if browser storage or preference detection is unavailable.
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Pet Heaven | A safe place to begin again</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
